<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roteirizador Rodalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --orange-top: #FF8C2E;
      --orange-main: #FF5E00;
      --orange-deep: #DC4100;
      --orange-dark: #A32900;
      --orange-ink: #9E2700;
      --glass-surface: rgba(26, 10, 2, 0.30);
      --glass-elevated: rgba(18, 7, 1, 0.44);
      --glass-input: rgba(14, 5, 1, 0.40);
      --border-subtle: rgba(255, 255, 255, 0.24);
      --border-strong: rgba(255, 255, 255, 0.52);
      --text-main: #FFFFFF;
      --text-soft: rgba(255, 255, 255, 0.82);
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      background-color: var(--orange-main);
      background-image:
        radial-gradient(circle at 50% -6%, rgba(255, 224, 178, 0.46) 0%, rgba(255, 152, 56, 0.14) 38%, transparent 66%),
        radial-gradient(circle at 92% 88%, rgba(255, 183, 107, 0.22) 0%, transparent 48%),
        linear-gradient(155deg, var(--orange-top) 0%, var(--orange-main) 38%, var(--orange-deep) 76%, var(--orange-dark) 100%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* SPLASH SCREEN */
    #splash-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 44%, rgba(255, 226, 182, 0.42) 0%, transparent 58%),
        linear-gradient(155deg, var(--orange-top) 0%, var(--orange-main) 40%, var(--orange-deep) 78%, var(--orange-dark) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      z-index: 9999;
      padding: 24px;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash-screen img {
      width: min(82vw, 440px);
      max-height: min(44vh, 360px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 16px 32px rgba(90, 22, 0, 0.32));
      animation: pulseLogo 1.7s ease-in-out infinite;
    }

    .splash-loader {
      width: 148px;
      height: 5px;
      background: rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      overflow: hidden;
    }

    .splash-loader::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 999px;
      animation: loadingBar 1.2s ease-in-out infinite;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes loadingBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(240%); }
    }

    /* CONTAINER PRINCIPAL */
    .app-wrapper {
      width: 100%;
      max-width: 960px;
      padding: 22px 18px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      flex: 1;
    }

    /* HEADER LIMPO */
    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding-top: 4px;
    }

    .main-logo {
      width: min(80vw, 360px);
      max-height: clamp(130px, 21vw, 195px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(85, 20, 0, 0.28));
    }

    .system-title {
      font-size: clamp(1.3rem, 2.8vw, 1.8rem);
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 0 3px 14px rgba(105, 24, 0, 0.32);
    }

    .unit-badge-bar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--glass-elevated);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-strong);
      padding: 6px 8px 6px 16px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      box-shadow: 0 10px 26px rgba(90, 20, 0, 0.24);
    }

    .unit-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 10px #34D399;
    }

    .btn-change-unit {
      background: #FFFFFF;
      color: var(--orange-ink);
      border: none;
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      transition: transform 0.15s ease;
    }

    .btn-change-unit:hover {
      transform: scale(1.04);
    }

    /* PAINÉIS */
    .panel {
      width: 100%;
      background: var(--glass-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 24px 20px;
      box-shadow: 0 20px 45px rgba(92, 22, 0, 0.28);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #FFFFFF;
    }

    .panel-title-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid var(--border-subtle);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* GRADE DE UNIDADES */
    .units-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .units-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    .unit-card {
      background: var(--glass-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 22px 14px;
      color: #FFFFFF;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11px;
      transition: all 0.2s ease;
    }

    .unit-card:hover, .unit-card:active {
      background: #FFFFFF;
      color: var(--orange-ink);
      border-color: #FFFFFF;
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(85, 20, 0, 0.30);
    }

    .unit-card-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid var(--border-subtle);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .unit-card:hover .unit-card-icon {
      background: rgba(255, 94, 0, 0.14);
      border-color: rgba(255, 94, 0, 0.3);
      color: var(--orange-main);
    }

    /* NAVEGAÇÃO */
    .main-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-bar-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .nav-bar-grid {
        grid-template-columns: 1.3fr 1fr 1fr;
      }
    }

    .btn-hero-roteirizar {
      background: #FFFFFF;
      color: var(--orange-ink);
      border: 1.5px solid #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      font-size: 1.02rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 12px 28px rgba(88, 20, 0, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-hero-roteirizar:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(88, 20, 0, 0.36);
    }

    .btn-secondary-nav {
      background: var(--glass-elevated);
      color: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 15px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.18s ease;
    }

    .btn-secondary-nav:hover {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-secondary-nav.active {
      background: rgba(255, 255, 255, 0.24);
      border-color: #FFFFFF;
      color: #FFFFFF;
    }

    /* PASSOS DA ROTEIRIZAÇÃO */
    .step-card {
      background: var(--glass-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
    }

    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .step-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .step-number {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: #FFFFFF;
      color: var(--orange-ink);
      font-size: 0.8rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-badges-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .availability-summary {
      font-size: 0.76rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid var(--border-subtle);
      color: #FFFFFF;
      padding: 4px 11px;
      border-radius: 999px;
    }

    .btn-reset-drivers {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid var(--border-strong);
      color: #FFFFFF;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease;
    }

    .btn-reset-drivers:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .mini-filter-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .mini-filter-wrap input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--glass-input);
      color: #FFFFFF;
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .mini-filter-wrap input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .mini-filter-wrap input:focus {
      border-color: #FFFFFF;
    }

    .mini-filter-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.7);
    }

    .availability-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .availability-grid::-webkit-scrollbar {
      width: 5px;
    }

    .availability-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.26);
      border-radius: 999px;
    }

    @media (min-width: 640px) {
      .availability-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .driver-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
    }

    .driver-toggle:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--border-strong);
    }

    .driver-toggle.unavailable {
      background: rgba(153, 27, 27, 0.56);
      border-color: #FCA5A5;
    }

    .driver-toggle-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .driver-toggle-text b {
      font-size: 0.86rem;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .driver-toggle-text span {
      font-size: 0.75rem;
      color: var(--text-soft);
      font-weight: 600;
    }

    .status-pill {
      flex-shrink: 0;
      font-size: 0.66rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .status-pill.ok {
      background: rgba(16, 185, 129, 0.25);
      color: #A7F3D0;
      border: 1px solid rgba(52, 211, 153, 0.55);
    }

    .status-pill.off {
      background: #DC2626;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* UPLOAD */
    .upload-zone {
      position: relative;
      border: 2px dashed rgba(255, 255, 255, 0.54);
      border-radius: var(--radius-lg);
      padding: 28px 18px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(14, 5, 1, 0.30) 100%);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: #FFFFFF;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(14, 5, 1, 0.36) 100%);
    }

    .upload-icon-circle {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: #FFFFFF;
      color: var(--orange-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(85, 20, 0, 0.24);
    }

    .loaded-file-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.24);
      border: 1px solid rgba(52, 211, 153, 0.6);
      color: #ECFDF5;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .upload-zone input[type="file"] {
      display: none;
    }

    /* KPIS E RESULTADO */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    @media (min-width: 640px) {
      .kpi-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .kpi-card {
      background: var(--glass-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .kpi-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-soft);
      letter-spacing: 0.4px;
    }

    .kpi-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: #FFFFFF;
    }

    .alert-box {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .alert-warning {
      background: rgba(146, 64, 14, 0.65);
      border: 1px solid #FCD34D;
      color: #FEF3C7;
    }

    .alert-success {
      background: rgba(6, 95, 70, 0.68);
      border: 1px solid #6EE7B7;
      color: #ECFDF5;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      margin-top: 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--glass-elevated);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    th, td {
      padding: 11px 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      white-space: nowrap;
    }

    th {
      background: rgba(0, 0, 0, 0.28);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      color: var(--text-soft);
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .tag-ok {
      display: inline-flex;
      align-items: center;
      background: rgba(16, 185, 129, 0.26);
      color: #A7F3D0;
      border: 1px solid rgba(52, 211, 153, 0.55);
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.7rem;
    }

    .tag-pend {
      display: inline-flex;
      align-items: center;
      background: rgba(220, 38, 38, 0.36);
      color: #FECACA;
      border: 1px solid rgba(248, 113, 113, 0.55);
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.7rem;
    }

    /* FORMULÁRIOS */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-soft);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 13px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--glass-input);
      color: #FFFFFF;
      font-size: 0.96rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }

    .form-group select option {
      background: #8F2200;
      color: #FFFFFF;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #FFFFFF;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      justify-content: center;
    }

    .btn-action {
      flex: 1;
      min-width: 160px;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-save {
      background: #FFFFFF;
      color: var(--orange-ink);
      box-shadow: 0 10px 24px rgba(85, 20, 0, 0.25);
    }

    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(85, 20, 0, 0.32);
    }

    .btn-delete {
      background: rgba(185, 28, 28, 0.72);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.35);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      border-color: var(--border-strong);
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.26);
      transform: translateY(-1px);
    }

    /* BUSCA DE VEÍCULOS */
    .search-box {
      width: 100%;
      margin-bottom: 14px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--glass-input);
      color: #FFFFFF;
      font-size: 0.94rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-box input:focus {

    }

      color: rgba(255, 255, 255, 0.6);

    .search-box svg {
      position: absolute;

    /* TOAST */

      position: fixed;

  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <img src="logo.png" alt="Rodalog Logo" />
    <div class="splash-loader"></div>
  </div>

  <!-- NOTIFICAÇÃO -->
  <div id="toast"></div>

  <div class="app-wrapper">
    <!-- TOPO -->
    <header>
      <img src="logo.png" alt="Roteirizador Rodalog" class="main-logo" />
      <h1 class="system-title">Roteirizador Rodalog</h1>

      <div id="active-unit-bar" class="unit-badge-bar hidden">
        <span class="unit-dot"></span>
        <span id="current-unit-label">-</span>
        <button class="btn-change-unit" onclick="voltarSelecaoUnidade()">Trocar</button>

    <!-- TELA 1: UNIDADES -->
    <section id="view-unidades" class="panel">
      <div class="panel-header">

      <div class="units-grid">
        <button class="unit-card" onclick="selecionarUnidade('MIX POA')">

          <span>MIX POA</span>
        </button>
        <button class="unit-card" onclick="selecionarUnidade('PELOTAS')">
          <span class="unit-card-icon"><i data-lucide="building-2" size="21"></i></span>
          <span>PELOTAS</span>
        </button>
        <button class="unit-card" onclick="selecionarUnidade('CHAPECO')">
          <span class="unit-card-icon"><i data-lucide="building-2" size="21"></i></span>
          <span>CHAPECO</span>
        </button>
        <button class="unit-card" onclick="selecionarUnidade('FLORIANOPOLIS')">
          <span class="unit-card-icon"><i data-lucide="building-2" size="21"></i></span>
          <span>FLORIANOPOLIS</span>
        </button>
        <button class="unit-card" onclick="selecionarUnidade('IJUI')">
          <span class="unit-card-icon"><i data-lucide="building-2" size="21"></i></span>
          <span>IJUI</span>
        </button>
        <button class="unit-card" onclick="selecionarUnidade('SANTA MARIA')">
          <span class="unit-card-icon"><i data-lucide="building-2" size="21"></i></span>

        </button>
      </div>
    </section>

    <!-- TELA 2: SISTEMA -->
    <main id="view-sistema" class="main-actions hidden">
      <div class="nav-bar-grid">
        <button id="nav-roteirizar" class="btn-hero-roteirizar" onclick="abrirAba('roteirizar')">
          <i data-lucide="route" size="20"></i>

        </button>
        <button id="nav-cadastrar" class="btn-secondary-nav" onclick="abrirAba('cadastrar', true)">
          <i data-lucide="truck" size="18"></i>
          <span>Cadastrar Veículo</span>
        </button>
        <button id="nav-buscar" class="btn-secondary-nav" onclick="abrirAba('buscar')">
          <i data-lucide="search" size="18"></i>
          <span>Buscar Veículo</span>
        </button>
      </div>

      <!-- ABA ROTEIRIZAR -->
      <section id="tab-roteirizar" class="panel">
        <!-- PASSO 1: FROTA -->
        <div class="step-card">
          <div class="step-header">
            <div class="step-title">
              <span class="step-number">1</span>
              <span>Disponibilidade</span>
            </div>
            <div class="step-badges-right">
              <span id="availability-counter" class="availability-summary">0 disponíveis</span>
              <button id="btn-restaurar-motoristas" class="btn-reset-drivers hidden" onclick="restaurarTodosMotoristas()">
                <i data-lucide="rotate-ccw" size="12"></i> Restaurar
              </button>
            </div>
          </div>

          <div class="mini-filter-wrap">
            <i data-lucide="search" size="15"></i>
            <input type="text" id="filtro-indisponibilidade" placeholder="Filtrar motorista ou placa..." oninput="renderizarSeletorIndisponibilidade()" />
          </div>

          <div id="lista-indisponibilidade" class="availability-grid"></div>
        </div>

        <!-- PASSO 2: EXCEL -->
        <div class="step-card" style="margin-bottom: 0;">
          <div class="step-header">
            <div class="step-title">
              <span class="step-number">2</span>
              <span>Planilha Excel</span>
            </div>
          </div>

          <label id="drop-zone" class="upload-zone" for="excel-input">
            <div class="upload-icon-circle">
              <i data-lucide="upload-cloud" size="25"></i>
            </div>
            <strong id="upload-title-text" style="font-size: 0.98rem; color: #FFFFFF;">Selecionar ou arrastar arquivo (.xlsx / .xls)</strong>
            <span id="loaded-file-badge" class="loaded-file-pill hidden"></span>
            <input type="file" id="excel-input" accept=".xlsx,.xls,.csv" onchange="processarArquivoExcel(event)" />

        </div>

        <!-- RESULTADOS -->
        <div id="routing-result-area" class="hidden">
          <div id="routing-kpis" class="kpi-grid"></div>
          <div id="routing-alert" class="alert-box"></div>

          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>DT</th>
                  <th>Caixas</th>
                  <th>Placa</th>
                  <th>Motorista</th>
                  <th>Capacidade</th>

              </thead>

      <!-- ABA CADASTRAR / EDITAR -->
      <section id="tab-cadastrar" class="panel hidden">
        <div class="panel-header">
          <div class="panel-title">
            <span class="panel-title-icon"><i data-lucide="plus-circle" size="17"></i></span>
            <span id="form-veiculo-titulo">Cadastrar Veículo</span>
          </div>
        </div>

        <input type="hidden" id="veiculo-id" />

        <div class="form-grid">
          <div class="form-group">
            <label for="veiculo-motorista">Motorista</label>
            <input type="text" id="veiculo-motorista" placeholder="NOME COMPLETO" style="text-transform: uppercase;" />
          </div>

          <div class="form-group">
            <label for="veiculo-placa">Placa</label>
            <input type="text" id="veiculo-placa" class="mono" maxlength="7" placeholder="ABC1D23" style="text-transform: uppercase;" />
          </div>

          <div class="form-group">
            <label for="veiculo-tipo">Veículo</label>
            <select id="veiculo-tipo">
              <option value="VAN">VAN</option>
              <option value="VUC">VUC</option>
              <option value="3/4">3/4</option>
              <option value="TOCO">TOCO</option>
              <option value="TRUCK">TRUCK</option>
              <option value="CARRETA">CARRETA</option>
            </select>
          </div>

          <div class="form-group">
            <label for="veiculo-capacidade">Capacidade (Caixas)</label>
            <input type="number" id="veiculo-capacidade" class="mono" min="1" placeholder="350" />
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-action btn-save" onclick="salvarVeiculo()">
            <i data-lucide="save" size="17"></i>
            <span>Salvar</span>
          </button>
          <button id="btn-form-editar-novo" class="btn-action btn-cancel hidden" onclick="limparFormularioVeiculo()">
            <i data-lucide="rotate-ccw" size="17"></i>
            <span>Limpar</span>
          </button>
          <button id="btn-form-deletar" class="btn-action btn-delete hidden" onclick="deletarVeiculoAtual()">
            <i data-lucide="trash-2" size="17"></i>
            <span>Deletar</span>
          </button>
        </div>
      </section>

      <!-- ABA BUSCAR -->
      <section id="tab-buscar" class="panel hidden">
        <div class="search-box">
          <i data-lucide="search" size="17"></i>
          <input type="text" id="campo-busca" placeholder="Pesquisar motorista, placa ou veículo..." oninput="filtrarVeiculos()" />
        </div>

        <div id="lista-veiculos" class="vehicle-list"></div>
      </section>
    </main>

    <!-- RODAPÉ -->
    <footer class="signature-footer">
      Desenvolvido por
      <a href="https://www.instagram.com/ocristianscherer/" target="_blank" rel="noopener noreferrer">
        Cristian Scherer
      </a>
    </footer>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzw6aE7o-MOAgD81TuChMoVvE2RlFMGl7-GkfK0fttwFjfOOceaayol2bSnL1_acDeYdg/exec";

    let unidadeAtual = "";
    let frotaUnidade = [];
    let indisponiveisIds = new Set();
    let ultimoArquivoExcel = null;
    let arquivoExportacaoPronto = null;
    let nomeArquivoGerado = "";

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      configurarDragAndDrop();
      setTimeout(() => {
        document.getElementById("splash-screen").classList.add("hidden");
      }, 2000);
    });

    function configurarDragAndDrop() {
      const dropZone = document.getElementById("drop-zone");
      if (!dropZone) return;

      ["dragenter", "dragover"].forEach(evtName => {
        dropZone.addEventListener(evtName, e => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add("dragover");
        });
      });

      ["dragleave", "drop"].forEach(evtName => {
        dropZone.addEventListener(evtName, e => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove("dragover");
        });
      });

      dropZone.addEventListener("drop", e => {
        const files = e.dataTransfer && e.dataTransfer.files;
        if (files && files.length > 0) {
          lerArquivoSelecionado(files[0]);
        }
      });
    }

    function mostrarToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function normalizarTexto(txt) {
      return String(txt || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .trim();
    }

    function normalizarPlaca(placa) {
      return String(placa || "")
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .trim();
    }

    function extrairValorCelulaExcelJs(cellValue) {
      if (cellValue === null || cellValue === undefined) return "";
      if (typeof cellValue === "object") {
        if ("result" in cellValue && cellValue.result !== null && cellValue.result !== undefined) {
          return String(cellValue.result).trim();
        }
        if ("richText" in cellValue && Array.isArray(cellValue.richText)) {
          return cellValue.richText.map(part => part.text || "").join("").trim();
        }
        if ("text" in cellValue) {
          return String(cellValue.text).trim();
        }
        return "";
      }
      return String(cellValue).trim();
    }

    function ehCodigoDTValido(valor) {
      const limpo = String(valor || "").trim();
      return /^\d{6,10}$/.test(limpo);
    }

    function ehResumoRota(valor) {
      const norm = normalizarTexto(valor);
      return /^(R|AS)\d+$/i.test(norm);
    }

    function ehLinhaTotal(dtRaw, row) {
      const dtNorm = normalizarTexto(dtRaw);
      if (/^TOTAL(\b|\s|:|-|\d)/i.test(dtNorm)) return true;
      return row.some(c => /^TOTAL(\b|\s|:|-|\d)/i.test(normalizarTexto(c)));
    }

    function parseNumeroPlanilha(val) {
      if (typeof val === "number") return Number.isFinite(val) ? val : 0;
      if (val && typeof val === "object") {
        if ("result" in val) return parseNumeroPlanilha(val.result);
        if ("text" in val) return parseNumeroPlanilha(val.text);
      }
      let s = String(val || "").trim();
      if (!s) return 0;
      s = s.replace(/\s+/g, "");
      if (s.includes(",") && s.includes(".")) {
        if (s.lastIndexOf(",") > s.lastIndexOf(".")) {
          s = s.replace(/\./g, "").replace(",", ".");
        } else {
          s = s.replace(/,/g, "");
        }
      } else if (s.includes(",")) {
        s = s.replace(",", ".");
      }
      const num = parseFloat(s);
      return Number.isFinite(num) ? num : 0;
    }

    function limparRoteirizacao(exibirAviso = true) {
      ultimoArquivoExcel = null;
      arquivoExportacaoPronto = null;
      nomeArquivoGerado = "";

      const inputExcel = document.getElementById("excel-input");
      if (inputExcel) inputExcel.value = "";

      const uploadTitle = document.getElementById("upload-title-text");
      if (uploadTitle) {
        uploadTitle.textContent = "Selecionar ou arrastar arquivo (.xlsx / .xls)";
      }

      const fileBadge = document.getElementById("loaded-file-badge");
      if (fileBadge) {
        fileBadge.textContent = "";
        fileBadge.classList.add("hidden");
      }

      document.getElementById("routing-result-area").classList.add("hidden");
      document.getElementById("routing-kpis").innerHTML = "";
      document.getElementById("routing-alert").innerHTML = "";
      document.getElementById("routing-preview-body").innerHTML = "";

      if (exibirAviso) {
        const painel = document.getElementById("tab-roteirizar");
        if (painel) {
          painel.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        mostrarToast("Pronto para nova roteirização.");
      }
      lucide.createIcons();
    }

    async function selecionarUnidade(unidade) {
      unidadeAtual = unidade;
      indisponiveisIds.clear();
      limparRoteirizacao(false);

      document.getElementById("current-unit-label").textContent = unidade;
      document.getElementById("active-unit-bar").classList.remove("hidden");
      document.getElementById("view-unidades").classList.add("hidden");
      document.getElementById("view-sistema").classList.remove("hidden");
      document.getElementById("filtro-indisponibilidade").value = "";

      abrirAba("roteirizar");
      await carregarFrotaDaUnidade();
    }

    function voltarSelecaoUnidade() {
      unidadeAtual = "";
      frotaUnidade = [];
      indisponiveisIds.clear();
      limparRoteirizacao(false);
      document.getElementById("active-unit-bar").classList.add("hidden");
      document.getElementById("view-sistema").classList.add("hidden");
      document.getElementById("view-unidades").classList.remove("hidden");
    }

    function abrirAba(aba, resetForm = false) {
      document.getElementById("tab-roteirizar").classList.add("hidden");
      document.getElementById("tab-cadastrar").classList.add("hidden");
      document.getElementById("tab-buscar").classList.add("hidden");

      document.getElementById("nav-cadastrar").classList.remove("active");
      document.getElementById("nav-buscar").classList.remove("active");

      document.getElementById(`tab-${aba}`).classList.remove("hidden");

      if (aba === "cadastrar") {
        document.getElementById("nav-cadastrar").classList.add("active");
        if (resetForm) limparFormularioVeiculo();
      } else if (aba === "buscar") {
        document.getElementById("nav-buscar").classList.add("active");
        renderizarListaVeiculos(frotaUnidade);
      } else if (aba === "roteirizar") {
        renderizarSeletorIndisponibilidade();
      }
      lucide.createIcons();
    }

    async function carregarFrotaDaUnidade() {
      try {
        mostrarToast(`Sincronizando ${unidadeAtual}...`);
        const resp = await fetch(`${SCRIPT_URL}?action=listar&unidade=${encodeURIComponent(unidadeAtual)}`);
        const json = await resp.json();
        if (json.status === "success") {
          frotaUnidade = json.veiculos || [];
          const idsValidos = new Set(frotaUnidade.map(v => String(v.id)));
          indisponiveisIds = new Set([...indisponiveisIds].filter(id => idsValidos.has(id)));
          localStorage.setItem(`rodalog_${unidadeAtual}`, JSON.stringify(frotaUnidade));
          renderizarListaVeiculos(frotaUnidade);
          renderizarSeletorIndisponibilidade();
          mostrarToast(`${frotaUnidade.length} veículos carregados.`);
        } else {
          mostrarToast(json.message || "Erro ao carregar frota.");
        }
      } catch (e) {
        const local = localStorage.getItem(`rodalog_${unidadeAtual}`);
        frotaUnidade = local ? JSON.parse(local) : [];
        renderizarListaVeiculos(frotaUnidade);
        renderizarSeletorIndisponibilidade();
        mostrarToast("Modo offline (cache local).");
      }
    }

    function renderizarSeletorIndisponibilidade() {
      const container = document.getElementById("lista-indisponibilidade");
      const counter = document.getElementById("availability-counter");
      const btnRestaurar = document.getElementById("btn-restaurar-motoristas");
      const termoFiltro = normalizarTexto(document.getElementById("filtro-indisponibilidade")?.value || "");

      const totalIndisp = indisponiveisIds.size;
      const totalDisp = Math.max(0, frotaUnidade.length - totalIndisp);
      counter.textContent = `${totalDisp}/${frotaUnidade.length} ativos`;

      if (btnRestaurar) {
        if (totalIndisp > 0) {
          btnRestaurar.classList.remove("hidden");
        } else {
          btnRestaurar.classList.add("hidden");
        }
      }

      if (!frotaUnidade || frotaUnidade.length === 0) {
        container.innerHTML = `<p style="font-size:0.84rem; color: var(--text-soft); padding: 4px;">Nenhum veículo cadastrado.</p>`;
        return;
      }

      const listaFiltrada = termoFiltro
        ? frotaUnidade.filter(v =>
            normalizarTexto(v.motorista).includes(termoFiltro) ||
            normalizarTexto(v.placa).includes(termoFiltro) ||
            normalizarTexto(v.tipo).includes(termoFiltro)
          )
        : frotaUnidade;

      if (listaFiltrada.length === 0) {
        container.innerHTML = `<p style="font-size:0.84rem; color: var(--text-soft); padding: 4px;">Nenhum resultado.</p>`;
        return;
      }

      container.innerHTML = listaFiltrada.map(v => {
        const idStr = String(v.id);
        const isOff = indisponiveisIds.has(idStr);
        return `
          <div class="driver-toggle ${isOff ? "unavailable" : ""}" onclick="alternarIndisponibilidade('${idStr}')">
            <div class="driver-toggle-text">
              <b>${v.motorista}</b>
              <span class="mono">${v.placa} • ${v.capacidade} cx</span>
            </div>
            <span class="status-pill ${isOff ? "off" : "ok"}">${isOff ? "OFF" : "ON"}</span>
          </div>
        `;
      }).join("");
    }

    function restaurarTodosMotoristas() {
      indisponiveisIds.clear();
      renderizarSeletorIndisponibilidade();
      mostrarToast("Frota restaurada.");
      if (ultimoArquivoExcel) {
        executarRoteirizacaoNoBuffer(ultimoArquivoExcel.buffer, ultimoArquivoExcel.fileName, false);
      }
    }

    function alternarIndisponibilidade(idStr) {
      if (indisponiveisIds.has(idStr)) {
        indisponiveisIds.delete(idStr);
      } else {
        indisponiveisIds.add(idStr);
      }
      renderizarSeletorIndisponibilidade();

      if (ultimoArquivoExcel) {
        executarRoteirizacaoNoBuffer(ultimoArquivoExcel.buffer, ultimoArquivoExcel.fileName, false);
      }
    }

    function limparFormularioVeiculo() {
      document.getElementById("form-veiculo-titulo").textContent = "Cadastrar Veículo";
      document.getElementById("veiculo-id").value = "";
      document.getElementById("veiculo-motorista").value = "";
      document.getElementById("veiculo-placa").value = "";
      document.getElementById("veiculo-tipo").value = "VAN";
      document.getElementById("veiculo-capacidade").value = "";
      document.getElementById("btn-form-deletar").classList.add("hidden");
      document.getElementById("btn-form-editar-novo").classList.add("hidden");
    }

    function editarVeiculo(id) {
      const v = frotaUnidade.find(item => String(item.id) === String(id));
      if (!v) return;

      abrirAba("cadastrar", false);
      document.getElementById("form-veiculo-titulo").textContent = "Editar Veículo";
      document.getElementById("veiculo-id").value = v.id;
      document.getElementById("veiculo-motorista").value = v.motorista;
      document.getElementById("veiculo-placa").value = v.placa;
      document.getElementById("veiculo-tipo").value = v.tipo;
      document.getElementById("veiculo-capacidade").value = v.capacidade;

      document.getElementById("btn-form-deletar").classList.remove("hidden");
      document.getElementById("btn-form-editar-novo").classList.remove("hidden");
    }

    async function salvarVeiculo() {
      const id = document.getElementById("veiculo-id").value.trim();
      const motorista = document.getElementById("veiculo-motorista").value.toUpperCase().trim();
      const placa = normalizarPlaca(document.getElementById("veiculo-placa").value);
      const tipo = document.getElementById("veiculo-tipo").value.toUpperCase().trim();
      const capacidade = Number(document.getElementById("veiculo-capacidade").value);

      if (!motorista || !placa || placa.length < 7 || !capacidade || capacidade <= 0) {
        mostrarToast("Preencha motorista, placa (7 caracteres) e caixas.");
        return;
      }

      const veiculoObj = { id, motorista, placa, tipo, capacidade };

      try {
        mostrarToast("Salvando...");
        const resp = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "salvar_veiculo",
            unidade: unidadeAtual,
            veiculo: veiculoObj
          })
        });
        const json = await resp.json();
        if (json.status === "success") {
          mostrarToast("Veículo salvo!");
          limparFormularioVeiculo();
          await carregarFrotaDaUnidade();
        } else {
          mostrarToast(json.message || "Erro ao salvar.");
        }
      } catch (e) {
        mostrarToast("Erro de rede ao salvar.");
      }
    }

    async function deletarVeiculoAtual() {
      const id = document.getElementById("veiculo-id").value;
      if (!id) return;
      await deletarVeiculoPorId(id);
      limparFormularioVeiculo();
    }

    async function deletarVeiculoPorId(id) {
      if (!confirm("Deletar este veículo?")) return;

      try {
        mostrarToast("Deletando...");
        const resp = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "deletar_veiculo",
            unidade: unidadeAtual,
            id: id
          })
        });
        const json = await resp.json();
        if (json.status === "success") {
          indisponiveisIds.delete(String(id));
          mostrarToast("Veículo deletado!");
          await carregarFrotaDaUnidade();
        } else {
          mostrarToast(json.message || "Erro ao deletar.");
        }
      } catch (e) {
        mostrarToast("Erro de rede ao deletar.");
      }
    }

    function filtrarVeiculos() {
      const termo = normalizarTexto(document.getElementById("campo-busca").value);
      const filtrados = frotaUnidade.filter(v =>
        normalizarTexto(v.motorista).includes(termo) ||
        normalizarTexto(v.placa).includes(termo) ||
        normalizarTexto(v.tipo).includes(termo)
      );
      renderizarListaVeiculos(filtrados);
    }

    function renderizarListaVeiculos(lista) {
      const container = document.getElementById("lista-veiculos");
      if (!lista || lista.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-soft); padding: 16px;">Nenhum veículo encontrado.</p>`;
        return;
      }

      container.innerHTML = lista.map(v => `
        <div class="vehicle-item">
          <div class="vehicle-info">
            <div class="vehicle-title-row">
              <span class="plate-badge mono">${v.placa}</span>
              <strong>${v.motorista}</strong>
            </div>
            <span>${v.tipo} • <b class="mono">${v.capacidade} cx</b></span>
          </div>
          <div class="vehicle-item-btns">
            <button class="btn-mini btn-mini-edit" onclick="editarVeiculo('${v.id}')">
              <i data-lucide="edit-3" size="13"></i> Editar
            </button>
            <button class="btn-mini btn-mini-del" onclick="deletarVeiculoPorId('${v.id}')">
              <i data-lucide="trash-2" size="13"></i> Deletar
            </button>
          </div>
        </div>
      `).join("");
      lucide.createIcons();
    }

    function processarArquivoExcel(event) {
      const file = event.target.files[0];
      if (!file) return;
      lerArquivoSelecionado(file);
    }

    function lerArquivoSelecionado(file) {
      const frotaAtiva = frotaUnidade.filter(v => !indisponiveisIds.has(String(v.id)));
      if (frotaAtiva.length === 0) {
        mostrarToast("Nenhum motorista ativo!");
      }

      const uploadTitle = document.getElementById("upload-title-text");
      if (uploadTitle) {
        uploadTitle.textContent = "Trocar arquivo (.xlsx / .xls)";
      }

      const fileBadge = document.getElementById("loaded-file-badge");
      if (fileBadge) {
        fileBadge.textContent = file.name;
        fileBadge.classList.remove("hidden");
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const buffer = new Uint8Array(e.target.result);
        ultimoArquivoExcel = { buffer: buffer, fileName: file.name };
        executarRoteirizacaoNoBuffer(buffer, file.name, true);
      };

      reader.readAsArrayBuffer(file);
    }

    function corEhAmarela(fill) {
      if (!fill || !fill.fgColor) return false;
      const argb = String(fill.fgColor.argb || fill.fgColor.rgb || "").toUpperCase();
      return argb.endsWith("FFFF00") || argb.endsWith("FFF2CC") || argb.endsWith("FFE699") || argb.endsWith("FFEB9C");
    }

    async function executarRoteirizacaoNoBuffer(buffer, originalFileName, salvarBackup) {
      try {
        const workbookXlsx = XLSX.read(buffer, { type: "array" });
        const firstSheetName = workbookXlsx.SheetNames[0];
        const worksheetXlsx = workbookXlsx.Sheets[firstSheetName];
        const rows = XLSX.utils.sheet_to_json(worksheetXlsx, { header: 1, defval: "" });

        if (rows.length < 2) {
          mostrarToast("Planilha vazia ou inválida.");
          return;
        }

        let headerRowIdx = 0;
        let colDT = -1;
        let colCX = -1;
        let colPlaca = -1;
        let colEntregador = -1;

        for (let r = 0; r < Math.min(rows.length, 15); r++) {
          const row = rows[r].map(cell => normalizarTexto(cell));
          const idxDT = row.findIndex(c => c === "DT" || c === "ROTA" || c === "NUM DT" || c === "NUMERO DT");
          if (idxDT !== -1) {
            headerRowIdx = r;
            colDT = idxDT;
            colCX = row.findIndex(c =>
              c.includes("CX CONVERTIDA PARADA") ||
              c.includes("CAIXA CONVERTIDA PARADA") ||
              c.includes("CX CONVERTIDA")
            );
            colPlaca = row.findIndex(c => c === "PLACA");
            colEntregador = row.findIndex(c => c === "ENTREGADOR" || c === "MOTORISTA");
            break;
          }
        }

        if (colDT === -1 || colCX === -1) {
          mostrarToast("Colunas 'DT' ou 'CX Convertida' não encontradas.");
          return;
        }

        if (colPlaca === -1) {
          colPlaca = rows[headerRowIdx].length;
        }
        if (colEntregador === -1) {
          colEntregador = Math.max(rows[headerRowIdx].length, colPlaca + 1);
        }

        const wbExcelJs = new ExcelJS.Workbook();
        await wbExcelJs.xlsx.load(buffer.slice().buffer);
        const wsExcelJs = wbExcelJs.worksheets[0];

        const rotasMap = new Map();
        let ultimaRotaAtiva = null;

        for (let i = headerRowIdx + 1; i < rows.length; i++) {
          const row = rows[i];
          const dtRaw = String(row[colDT] || "").trim();

          if (ehLinhaTotal(dtRaw, row)) {
            continue;
          }

          const cxVal = parseNumeroPlanilha(row[colCX]);
          const cellExcelJs = wsExcelJs ? wsExcelJs.getRow(i + 1).getCell(colCX + 1) : null;
          const linhaTemAmarelo = cellExcelJs ? corEhAmarela(cellExcelJs.fill) : false;

          if (ehCodigoDTValido(dtRaw) && !linhaTemAmarelo) {
            if (!rotasMap.has(dtRaw)) {
              rotasMap.set(dtRaw, {
                dt: dtRaw,
                valoresParada: [],
                valorResumoRota: null,
                linhasDT: []
              });
            }
            const grupo = rotasMap.get(dtRaw);
            grupo.linhasDT.push(i);
            grupo.valoresParada.push(cxVal);
            ultimaRotaAtiva = grupo;
            continue;
          }

          if (ultimaRotaAtiva && (ehResumoRota(dtRaw) || linhaTemAmarelo || (!dtRaw && cxVal > 0))) {
            if (cxVal > 0) {
              ultimaRotaAtiva.valorResumoRota = cxVal;
            }
            ultimaRotaAtiva = null;
          }
        }

        const rotasConsolidadas = [];
        rotasMap.forEach(grupo => {
          let totalCarga = 0;

          if (grupo.valorResumoRota !== null && grupo.valorResumoRota > 0) {
            totalCarga = grupo.valorResumoRota;
          } else {
            const naoVazios = grupo.valoresParada.filter(v => v > 0);
            const todosIguais =
              naoVazios.length > 1 &&
              naoVazios.every(v => Math.abs(v - naoVazios[0]) < 0.0001);

            totalCarga = todosIguais
              ? naoVazios[0]
              : grupo.valoresParada.reduce((acc, v) => acc + v, 0);
          }

          rotasConsolidadas.push({
            dt: grupo.dt,
            totalCaixas: Math.round(totalCarga * 100) / 100,
            linhasDT: grupo.linhasDT,
            veiculoAlocado: null
          });
        });

        rotasConsolidadas.sort((a, b) => b.totalCaixas - a.totalCaixas);

        const veiculosDisponiveis = frotaUnidade
          .filter(v => !indisponiveisIds.has(String(v.id)))
          .map(v => ({ ...v, usado: false }))
          .sort((a, b) => a.capacidade - b.capacidade);

        const rotasNaoAtendidas = [];

        rotasConsolidadas.forEach(rota => {
          const veiculoIdeal = veiculosDisponiveis.find(
            v => !v.usado && v.capacidade >= rota.totalCaixas
          );

          if (veiculoIdeal) {
            veiculoIdeal.usado = true;
            rota.veiculoAlocado = veiculoIdeal;
          } else {
            rotasNaoAtendidas.push(rota);
          }
        });

        if (wsExcelJs) {
          const headerRow = wsExcelJs.getRow(headerRowIdx + 1);
          const cellHdrPlaca = headerRow.getCell(colPlaca + 1);
          const cellHdrEntr = headerRow.getCell(colEntregador + 1);
          if (!String(cellHdrPlaca.value || "").trim()) cellHdrPlaca.value = "PLACA";
          if (!String(cellHdrEntr.value || "").trim()) cellHdrEntr.value = "ENTREGADOR";

          const totalLinhasExcel = Math.max(rows.length, wsExcelJs.rowCount);
          for (let i = headerRowIdx + 1; i < totalLinhasExcel; i++) {
            const rObj = wsExcelJs.getRow(i + 1);
            rObj.getCell(colPlaca + 1).value = null;
            rObj.getCell(colEntregador + 1).value = null;
          }

          rotasConsolidadas.forEach(rota => {
            if (rota.veiculoAlocado) {
              const placaFmt = normalizarPlaca(rota.veiculoAlocado.placa);
              const motoristaFmt = rota.veiculoAlocado.motorista.toUpperCase().trim();

              rota.linhasDT.forEach(rowIdx => {
                const rObj = wsExcelJs.getRow(rowIdx + 1);
                const dtNaCelula = extrairValorCelulaExcelJs(rObj.getCell(colDT + 1).value);
                if (ehCodigoDTValido(dtNaCelula)) {
                  rObj.getCell(colPlaca + 1).value = placaFmt;
                  rObj.getCell(colEntregador + 1).value = motoristaFmt;
                }
              });
            }
          });
        }

        const outBuffer = await wbExcelJs.xlsx.writeBuffer();
        arquivoExportacaoPronto = new Uint8Array(outBuffer);

        const baseName = originalFileName.replace(/\.[^/.]+$/, "");
        nomeArquivoGerado = `${baseName}_ROTEIRIZADO_${unidadeAtual.replace(/\s+/g, "_")}.xlsx`;

        renderizarResultadoRoteirizacao(rotasConsolidadas, rotasNaoAtendidas);
        lucide.createIcons();

        if (salvarBackup) {
          enviarBackupDrive(arquivoExportacaoPronto, nomeArquivoGerado);
        }
      } catch (err) {
        console.error(err);
        mostrarToast("Erro ao processar Excel.");
      }
    }

    function renderizarResultadoRoteirizacao(rotas, naoAtendidas) {
      const area = document.getElementById("routing-result-area");
      const kpiGrid = document.getElementById("routing-kpis");
      const alertBox = document.getElementById("routing-alert");
      const tbody = document.getElementById("routing-preview-body");

      area.classList.remove("hidden");

      const totalRotas = rotas.length;
      const alocadas = totalRotas - naoAtendidas.length;
      const totalCaixasGeral = Math.round(rotas.reduce((acc, r) => acc + r.totalCaixas, 0) * 100) / 100;

      kpiGrid.innerHTML = `
        <div class="kpi-card">
          <span class="kpi-label">DTs</span>
          <span class="kpi-value mono">${totalRotas}</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Alocadas</span>
          <span class="kpi-value mono" style="color: #A7F3D0;">${alocadas}</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Pendentes</span>
          <span class="kpi-value mono" style="color: ${naoAtendidas.length > 0 ? "#FCA5A5" : "#FFFFFF"};">${naoAtendidas.length}</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Caixas</span>
          <span class="kpi-value mono">${totalCaixasGeral}</span>
        </div>
      `;

      if (naoAtendidas.length > 0) {
        const listaDTs = naoAtendidas.map(r => `${r.dt} (${r.totalCaixas} cx)`).join(" • ");
        alertBox.className = "alert-box alert-warning";
        alertBox.innerHTML = `
          ⚠️ <b>${naoAtendidas.length} DT(s) sem veículo compatível:</b><br/>
          <span class="mono" style="font-size: 0.82rem;">${listaDTs}</span>
        `;
      } else {
        alertBox.className = "alert-box alert-success";
        alertBox.innerHTML = `✅ <b>${rotas.length} DT(s)</b> roteirizadas com sucesso.`;
      }

      tbody.innerHTML = rotas.map(r => {
        if (r.veiculoAlocado) {
          return `
            <tr>
              <td class="mono"><b>${r.dt}</b></td>
              <td class="mono">${r.totalCaixas} cx</td>
              <td><span class="plate-badge mono">${normalizarPlaca(r.veiculoAlocado.placa)}</span></td>
              <td><b>${r.veiculoAlocado.motorista.toUpperCase()}</b></td>
              <td class="mono">${r.veiculoAlocado.capacidade} cx</td>
              <td><span class="tag-ok">OK</span></td>
            </tr>
          `;
        } else {
          return `
            <tr>
              <td class="mono"><b>${r.dt}</b></td>
              <td class="mono">${r.totalCaixas} cx</td>
              <td style="color: var(--text-soft);">—</td>
              <td style="color: var(--text-soft);">—</td>
              <td>—</td>
              <td><span class="tag-pend">PENDENTE</span></td>
            </tr>
          `;
        }
      }).join("");
    }

    function baixarExcelAtualizado() {
      if (!arquivoExportacaoPronto) return;
      const blob = new Blob([arquivoExportacaoPronto], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nomeArquivoGerado;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      mostrarToast("Download iniciado!");
    }

    function uint8ToBase64(u8Arr) {
      let chunk = 0x8000;
      let result = "";
      for (let i = 0; i < u8Arr.length; i += chunk) {
        result += String.fromCharCode.apply(null, u8Arr.subarray(i, i + chunk));
      }
      return btoa(result);
    }

    async function enviarBackupDrive(u8Buffer, fileName) {
      try {
        const wbBase64 = uint8ToBase64(u8Buffer);
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "backup_excel",
            unidade: unidadeAtual,
            fileName: fileName,
            fileBase64: wbBase64
          })
        });
      } catch (e) {}
    }
  </script>
